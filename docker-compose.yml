services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: durable_agents
      POSTGRES_PASSWORD: durable_agents
      POSTGRES_DB: durable_agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable_agents"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
